<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Lumen - Cálculo de Consumo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--primary:#2f4a1c;--highlight:#b8b52a;}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f4f1;color:#222}
header{background:var(--primary);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
header img{max-height:48px;max-width:120px}
header h1{font-size:20px;margin:0}
header small{color:var(--highlight);font-size:14px}
main{padding:12px;max-width:800px;margin:auto}
section{background:#fff;border-radius:10px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
h2{font-size:17px;color:var(--primary);margin:0 0 10px}
label{display:block;font-size:13px;margin:8px 0 3px;color:#444}
input,button{width:100%;padding:10px;font-size:16px;border:1px solid #bbb;border-radius:6px}
input[type=color]{height:44px;padding:4px}
input[type=file]{font-size:14px;padding:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{background:var(--primary);color:#fff;border:none;cursor:pointer;margin-top:8px}
button.alt{background:var(--highlight);color:#222}
button.danger{background:#a33}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
th,td{border-bottom:1px solid #ddd;padding:6px;text-align:left}
td input{padding:6px;font-size:14px}
.item{border:1px solid #ddd;border-radius:8px;padding:10px;margin-top:8px}
.result{font-size:15px;line-height:1.7}
.result b{color:var(--primary)}
.status{font-size:14px;color:#444;margin-top:6px}
#print-area{display:none}
@media print{
  body>*:not(#print-area){display:none!important}
  #print-area{display:block!important;color:#000;font-family:Arial,Helvetica,sans-serif}
  .rep-head{display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--primary);padding-bottom:8px}
  .rep-head img{max-height:70px;max-width:180px}
  .rep-head h1{color:var(--primary);margin:0;font-size:22px}
  .rep-head p{margin:2px 0;color:var(--highlight);font-weight:bold}
  #print-area h2{color:var(--primary);font-size:17px;margin:14px 0 4px}
  #print-area h3{color:var(--primary);margin:14px 0 4px;font-size:14px}
  #print-area table{width:100%;border-collapse:collapse;font-size:12px}
  #print-area th{background:var(--primary);color:#fff;text-align:left;padding:5px}
  #print-area td{border-bottom:1px solid #ccc;padding:4px}
  .bill{width:100%;page-break-before:always;margin-top:8px}
  .foot{margin-top:20px;border-top:2px solid var(--highlight);padding-top:6px;font-size:11px;color:var(--primary)}
}
</style>
</head>
<body>
<header>
  <img id="hdrLogo" src="" alt="" style="display:none">
  <div><h1 id="hdrName"></h1><small id="hdrSlogan"></small></div>
</header>

<main>
  <section>
    <h2>Configurações da empresa</h2>
    <label>Nome da empresa</label>
    <input id="sCompany">
    <label>Slogan</label>
    <input id="sSlogan">
    <label>Logo (PNG ou JPG)</label>
    <input type="file" id="logoFile" accept="image/*">
    <div class="row">
      <div><label>Cor principal</label><input type="color" id="sPrimary"></div>
      <div><label>Cor de destaque</label><input type="color" id="sHighlight"></div>
    </div>
  </section>

  <section>
    <h2>Cliente</h2>
    <label>Nome</label>
    <input id="cName">
    <label>Endereço</label>
    <input id="cAddress">
    <label>Tarifa (R$/kWh)</label>
    <input id="cTariff" type="number" step="0.01" inputmode="decimal">
  </section>

  <section>
    <h2>Histórico de consumo (últimos 12 meses)</h2>
    <p class="status">Envie a conta em PDF para tentar preencher automaticamente, ou um CSV com colunas: mês;kWh;valor. Confira sempre a tabela.</p>
    <label>Conta de energia (PDF)</label>
    <input type="file" id="billFile" accept="application/pdf" multiple>
    <label>Importar CSV</label>
    <input type="file" id="csvFile" accept=".csv,.txt">
    <p class="status" id="billStatus"></p>
    <table>
      <thead><tr><th>Mês</th><th>kWh</th><th>R$</th></tr></thead>
      <tbody id="history"></tbody>
    </table>
  </section>

  <section>
    <h2>Aparelhos</h2>
    <button class="alt" id="addDevice">+ Adicionar aparelho</button>
    <button class="alt" id="addAc">+ Adicionar ar-condicionado (BTU)</button>
    <div id="appliances"></div>
  </section>

  <section>
    <h2>Resultado</h2>
    <div class="result" id="results"></div>
  </section>

  <section>
    <h2>Gerar relatório</h2>
    <button id="pdfBtn">Gerar PDF (Salvar como PDF)</button>
    <button class="danger" id="newClient">Novo cliente</button>
  </section>
</main>

<div id="print-area"></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const DEFAULT_SETTINGS={company:'Prime Lumen',slogan:'Tecnologia Solar',logo:'',primary:'#2f4a1c',highlight:'#b8b52a'};
const EMPTY_CLIENT=()=>({name:'',address:'',tariff:'0.90',history:Array.from({length:12},()=>({month:'',kwh:'',value:''})),appliances:[]});

let settings={...DEFAULT_SETTINGS,...JSON.parse(localStorage.getItem('pl_settings')||'{}')};
let client={...EMPTY_CLIENT(),...JSON.parse(localStorage.getItem('pl_client')||'{}')};
let billImages=[];

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n;};
const fmt=(n,d=2)=>Number(n).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const saveSettings=()=>localStorage.setItem('pl_settings',JSON.stringify(settings));
const saveClient=()=>localStorage.setItem('pl_client',JSON.stringify(client));

// Consumo mensal de um aparelho (kWh/mês)
function applianceKwh(a){
  const days=num(a.days)||30, hours=num(a.hours), qty=num(a.qty)||1;
  if(a.type==='ac'){
    const watts=num(a.btu)*0.293;
    return ((watts*hours*days)/1000)*0.3*qty;
  }
  return (num(a.watts)*hours*days*qty)/1000;
}

// Resumo: média da conta + consumo dos aparelhos
function summary(){
  const tariff=num(client.tariff);
  const hs=client.history.map(h=>({kwh:num(h.kwh),value:num(h.value)}));
  const withKwh=hs.filter(h=>h.kwh>0);
  const months=withKwh.length;
  const avgKwh=months?withKwh.reduce((s,h)=>s+h.kwh,0)/months:0;
  const withVal=hs.filter(h=>h.value>0);
  const avgValue=withVal.length?withVal.reduce((s,h)=>s+h.value,0)/withVal.length:avgKwh*tariff;
  const appKwh=client.appliances.reduce((s,a)=>s+applianceKwh(a),0);
  const appValue=appKwh*tariff;
  return {tariff,months,avgKwh,avgValue,appKwh,appValue,projKwh:avgKwh+appKwh,projValue:avgValue+appValue};
}

function applySettings(){
  document.documentElement.style.setProperty('--primary',settings.primary);
  document.documentElement.style.setProperty('--highlight',settings.highlight);
  $('hdrName').textContent=settings.company;
  $('hdrSlogan').textContent=settings.slogan;
  $('hdrLogo').src=settings.logo||'';
  $('hdrLogo').style.display=settings.logo?'block':'none';
}

function renderHistory(){
  $('history').innerHTML=client.history.map((h,i)=>`<tr>
    <td><input data-h="${i}" data-f="month" value="${esc(h.month)}" placeholder="JUN/25"></td>
    <td><input data-h="${i}" data-f="kwh" type="number" inputmode="decimal" value="${esc(h.kwh)}"></td>
    <td><input data-h="${i}" data-f="value" type="number" inputmode="decimal" step="0.01" value="${esc(h.value)}"></td>
  </tr>`).join('');
}

function renderAppliances(){
  $('appliances').innerHTML=client.appliances.map((a,i)=>{
    const isAc=a.type==='ac';
    const f=isAc?'btu':'watts';
    return `<div class="item">
      <label>Nome</label>
      <input data-a="${i}" data-f="name" value="${esc(a.name)}">
      <div class="row">
        <div><label>${isAc?'BTU':'Potência (W)'}</label><input type="number" inputmode="decimal" data-a="${i}" data-f="${f}" value="${esc(a[f])}"></div>
        <div><label>Horas/dia</label><input type="number" step="0.5" inputmode="decimal" data-a="${i}" data-f="hours" value="${esc(a.hours)}"></div>
        <div><label>Dias/mês</label><input type="number" inputmode="numeric" data-a="${i}" data-f="days" value="${esc(a.days)}"></div>
        <div><label>Quantidade</label><input type="number" inputmode="numeric" data-a="${i}" data-f="qty" value="${esc(a.qty)}"></div>
      </div>
      <p class="result">Consumo: <b id="ak${i}">${fmt(applianceKwh(a))}</b> kWh/mês</p>
      <button class="danger" data-rm="${i}">Remover</button>
    </div>`;
  }).join('');
}

function renderResults(){
  const s=summary();
  $('results').innerHTML=`
    Meses com histórico: <b>${s.months}</b> (de 12)<br>
    Média de consumo da conta: <b>${fmt(s.avgKwh,1)} kWh/mês</b><br>
    Média da conta: <b>R$ ${fmt(s.avgValue)}/mês</b><br>
    Consumo dos aparelhos: <b>${fmt(s.appKwh,1)} kWh/mês</b> (R$ ${fmt(s.app
